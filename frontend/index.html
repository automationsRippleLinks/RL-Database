<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <title>Ripple Pulse</title>
    <script>
      // Set the theme class before first paint. Doing this in React instead would
      // flash the wrong palette on every load for anyone whose choice differs from
      // the default. Must stay in sync with src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('rl-theme');
          var dark = stored
            ? stored === 'dark'
            : !window.matchMedia('(prefers-color-scheme: light)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <!-- please don't remove zoom-[0.9] -->
    <div id="root" class="zoom-[0.95]"></div> 
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
