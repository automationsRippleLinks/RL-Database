[project]
name = "Ripple-Pulse"
version = "0.1.0"
description = "Internal database for RippleLinks"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard]>=0.139.0,<1.0.0",
    "pydantic>2.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "email-validator<3.0.0.0,>=2.1.0.post1",
    "phonenumbers>=9.0.0,<10.0.0",
    "sqlmodel>=0.0.47,<1.0.0",
    "alembic<2.0.0,>=1.12.1",
    "asyncpg>=0.30.0,<1.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "sqlalchemy>=2.0.0,<2.1.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "redis[hiredis]>=8.1.0,<9.0",
    "google-auth>=2.56.0",
    "httpx>=0.28.0",
    "aiosmtplib>=5.1.0",
    "requests>=2.34.0",
    "taskiq[opentelemetry]>=0.12.6,<0.13",
    "taskiq-redis>=1.2.3,<2",
    "apify-client>=3.2.0,<4",
    "langchain-core>=1.6.4,<2",
    "langchain-anthropic>=1.7.4,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-instrumentation-redis>=0.66b0",
    "opentelemetry-instrumentation-httpx>=0.66b0",
]

[tool.fastapi]
entrypoint = "app.main:app"
